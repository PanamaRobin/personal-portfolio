<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jorge L. Herrera — Software Engineer</title>
    <meta
      name="description"
      content="Jorge L. Herrera — Panamanian software engineer building complex apps, AI-touched products, and the everyday work of features, APIs, tests, and deploys."
    />
    <!-- Applied before first paint so the page never flashes the wrong theme. -->
    <script>
      try {
        var t = localStorage.getItem('jh-portfolio-theme');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
